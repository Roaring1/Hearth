[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hearth"
dynamic = ["version"]
description = "GTK control panel for a PipeWire virtual-mixer audio rig"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["pipewire", "audio", "mixer", "gtk", "linux", "kde"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Mixers",
]

# PyGObject is deliberately NOT a pip dependency. On Linux desktops it is
# provided by the distribution (python3-gobject / python-gobject) and building
# it from source in a venv is a well-known source of breakage. The UI layer
# fails with a clear message if it is missing; everything else works without it.
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pre-commit>=3.8",
]

[project.scripts]
hearth = "hearth.cli:main"

[project.urls]
Homepage = "https://github.com/Roaring1/Hearth"
Issues = "https://github.com/Roaring1/Hearth/issues"
Changelog = "https://github.com/Roaring1/Hearth/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/hearth/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hearth"]


# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Nothing is excluded from lint any more: hearth.py is a 26-line shim, and the
# legacy code that moved into the package carries a scoped, documented
# per-file-ignores list instead of being hidden from the linter entirely.

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle + pyflakes
  "I",             # import sorting
  "UP",            # pyupgrade
  "B",             # bugbear
  "C4",            # comprehensions
  "SIM",           # simplifications
  "RET",           # return hygiene
  "PTH",           # pathlib over os.path
  "TID",           # tidy / banned imports
  "S",             # bandit: this is what bans shell=True
  "RUF",
]
ignore = [
  "S603",  # subprocess call without shell -- that is exactly what we want
  "S607",  # partial executable path: PATH lookup is correct for pactl/systemctl
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]              # asserts are the point of a test
"tests/conftest.py" = ["S101", "TID251"]  # probes for gi to decide whether to skip GUI tests
# The functional check drives the real GTK widgets against the live audio
# graph, so it has to import gi like the UI it exercises. It is a manual
# check, not part of the test suite, and stays out of src/ for that reason.
"scripts/func_check.py" = ["TID251", "E402"]

# Legacy debt, scoped and visible rather than excluded. These two files are
# verbatim moves out of the 2,864-line original; reformatting them in the same
# pass that moved them would have made the diff unreviewable. The rules that
# actually matter are NOT ignored here: S602/S604 (shell=True), E722 (bare
# except), and the gi ban outside hearth.ui all stay hard errors. Each entry
# shrinks as Phase 4 rewrites the UI.
"src/hearth/legacy_core.py" = [
  "E401", "E501", "E701", "E702", "E741",  # legacy one-line style
  "S110", "SIM105", "SIM102", "SIM115", "SIM223",
  "RUF005", "RUF022", "PTH101", "PTH105", "PTH123", "C420", "I001",
]
"src/hearth/ui/*" = [
  "TID251",                                  # hearth.ui is the one package allowed to import gi
  "F403", "F405",                            # staged star import from legacy_core, retired in Phase 4
  "E401", "E501", "E701", "E702", "E741",
  "F401", "S110", "SIM105", "SIM102", "SIM115", "SIM223",
  "RUF005", "RUF022", "PTH101", "PTH105", "PTH123", "C420", "I001",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# Architectural rule, enforced by the linter rather than by good intentions:
# only hearth.ui may import the GTK bindings.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"gi".msg = "Only hearth.ui may import gi. Keep the core GTK-free so it stays testable."
"gi.repository".msg = "Only hearth.ui may import gi. Keep the core GTK-free so it stays testable."

[tool.ruff.lint.isort]
known-first-party = ["hearth"]

[tool.ruff.format]
quote-style = "double"


# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.11"
# The shipped package only. The test modules are top-level (there is no
# tests/__init__.py), so a `tests.*` override silently never matches them --
# which is exactly the kind of config that looks strict and enforces nothing.
# Tests are verified by running them.
files = ["src/hearth"]
strict = true
warn_unreachable = true
# Strict typing applies to the modules written for this refactor. The two
# excluded areas are the verbatim legacy code: annotating 2,600 lines of GTK
# callbacks would be a rewrite wearing a type checker's clothes, and Phase 4
# replaces that code anyway. Each exclusion is removed as its module is
# rewritten, not extended.
exclude = [
  "^src/hearth/ui/",          # GTK layer; PyGObject has no usable stubs
  "^src/hearth/legacy_core\\.py$",  # verbatim move from the original script
  "^hearth\\.py$",            # 26-line path shim
]

[[tool.mypy.overrides]]
# PyGObject ships no usable stubs; the UI layer is checked by running it.
module = ["gi.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `exclude` only skips files mypy crawls; it still follows imports into them.
# These are the same two legacy areas named in the exclude list above, and
# both disappear from this list as Phase 4 rewrites them.
module = ["hearth.ui", "hearth.ui.*", "hearth.legacy_core"]
ignore_errors = true

[[tool.mypy.overrides]]
# Tests are checked for correctness by running them. Requiring annotations on
# every fixture and assertion helper buys nothing and discourages writing them.
module = ["tests.*", "conftest"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
# cli.py is the boundary that calls into the untyped legacy module by design.
module = ["hearth.cli"]
disallow_untyped_calls = false


# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "gui: needs a display and PyGObject; skipped automatically when unavailable",
]
