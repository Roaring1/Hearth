# pre-commit install   # once, after: pip install -e '.[dev]'
minimum_pre_commit_version: "3.8.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      # tests/fixtures/ holds verbatim captures of real pactl / pw-link /
      # systemctl output, which genuinely emits trailing tabs. The suite still
      # passes with that whitespace stripped (checked: 249 passed either way),
      # so this is about capture fidelity, not a current test dependency -- a
      # fixture silently rewritten by a formatter is no longer evidence of what
      # the tool actually printed.
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/
      - id: trailing-whitespace
        exclude: ^tests/fixtures/
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^tests/fixtures/

  # Keep this rev in step with the ruff pinned in pyproject's [dev] extra.
  # A drifted hook lints with different rules than scripts/check.sh: v0.8.6
  # still enforced UP038, which ruff has since removed as bad advice.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      - id: desktop-file-validate
        name: validate desktop entries
        entry: desktop-file-validate
        language: system
        files: \.desktop$
      - id: appstream-validate
        name: validate appstream metainfo
        entry: appstreamcli validate --pedantic
        language: system
        files: \.(metainfo|appdata)\.xml$
