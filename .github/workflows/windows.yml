name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  ucrt64:
    name: UCRT64 tests and installed-wheel smoke
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # MSYS2 documents this before-checkout setting to preserve Unix line
      # endings for scripts consumed by its toolchain.
      - name: Configure Git line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v7

      - name: Set up MSYS2 UCRT64 runtime
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-gdk-pixbuf2
            mingw-w64-ucrt-x86_64-gobject-introspection-runtime
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-python-cairo
            mingw-w64-ucrt-x86_64-python-comtypes
            mingw-w64-ucrt-x86_64-python-psutil
            mingw-w64-ucrt-x86_64-ruff

      - name: Verify the native GTK and COM runtime
        shell: msys2 {0}
        run: |
          python --version
          pacman -Q mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-python-gobject mingw-w64-ucrt-x86_64-gtk4
          python - <<'PY'
          import comtypes
          import gi
          import psutil

          gi.require_version("Gtk", "4.0")
          from gi.repository import Gtk

          print(f"GTK {Gtk.get_major_version()}.{Gtk.get_minor_version()}")
          print(f"comtypes {comtypes.__version__}")
          print(f"psutil {psutil.__version__}")
          PY

      - name: Create an isolated development venv
        shell: msys2 {0}
        run: |
          python -m venv .venv-ci --system-site-packages
          .venv-ci/bin/python.exe -m pip install --upgrade pip
          # Install only CI tools used below; pre-commit adds PyYAML, whose
          # C extension has no wheel for MSYS2's mingw ABI. Mypy 1.18.2 has
          # no librt build dependency and remains Python 3.14-compatible.
          .venv-ci/bin/python.exe -m pip install -e . 'mypy==1.18.2' 'pytest>=8.0' 'pytest-cov>=5.0' build

      - name: Lint and type-check the Windows source
        shell: msys2 {0}
        run: |
          ruff check --output-format=github .
          ruff format --check .
          .venv-ci/bin/mypy.exe

      - name: Run the non-GUI test suite
        shell: msys2 {0}
        # -P prevents the repository's top-level hearth.py compatibility shim
        # from shadowing the src/hearth package on sys.path.
        run: .venv-ci/bin/python.exe -P -m pytest -m "not gui"

      - name: Build wheel and source distribution
        shell: msys2 {0}
        run: .venv-ci/bin/python.exe -m build --wheel --sdist

      - name: Verify packaged GTK artwork in wheel
        shell: msys2 {0}
        run: |
          .venv-ci/bin/python.exe - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = sorted(Path("dist").glob("hearth-*.whl"), key=lambda p: p.stat().st_mtime, reverse=True)
          if not wheels:
              raise SystemExit("No Hearth wheel was built.")
          required = (
              "hearth/ui/gtk4/assets/art/app-muted@2x.png",
              "hearth/ui/gtk4/assets/art/app-unmuted@2x.png",
          )
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
              for name in required:
                  if name not in names:
                      raise SystemExit(f"Missing packaged artwork: {name}")
                  data = wheel.read(name)
                  if not data.startswith(bytes.fromhex("89504e470d0a1a0a")):
                      raise SystemExit(f"Invalid PNG artwork: {name}")
                  print(f"Verified {name} ({len(data)} bytes)")
          PY

      # Exercise the shipped bootstrap path against a fresh venv and the
      # just-built wheel. This import-only probe must not enumerate endpoints
      # or perform playback, capture, routing, or service operations.
      - name: Install and probe the built wheel in a clean UCRT64 venv
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $ErrorActionPreference = "Stop"

          $wheel = Get-ChildItem -LiteralPath "dist" -Filter "hearth-*.whl" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($null -eq $wheel) {
            throw "The build did not produce a Hearth wheel."
          }

          $venv = Join-Path $env:RUNNER_TEMP "hearth-wheel-smoke"
          $venvPython = Join-Path $venv "bin\python.exe"
          try {
            & .\scripts\windows_bootstrap.ps1 -MsysRoot $env:MSYS2_LOCATION -VenvPath $venv -WheelPath $wheel.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "The Windows bootstrap script failed with exit code $LASTEXITCODE."
            }

            & $venvPython -P -m hearth --version
            if ($LASTEXITCODE -ne 0) {
              throw "The installed Hearth wheel failed its CLI version smoke test."
            }
          }
          finally {
            if (Test-Path -LiteralPath $venv) {
              Remove-Item -LiteralPath $venv -Recurse -Force
            }
          }
