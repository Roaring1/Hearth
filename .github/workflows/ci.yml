name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: mypy
      - name: Validate desktop entries and metadata
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils appstream shellcheck
          find . -name '*.desktop' -not -path './.git/*' -print0 \
            | xargs -0 -r -n1 desktop-file-validate
          find data -name '*.metainfo.xml' -print0 2>/dev/null \
            | xargs -0 -r -n1 appstreamcli validate --pedantic
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -r -n1 shellcheck

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install GTK and PyGObject from the distro
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            gir1.2-ayatanaappindicator3-0.1 xvfb
      - run: pip install -e '.[dev]'
      - name: Run tests (GUI tests under a virtual display)
        run: xvfb-run -a pytest

  package:
    name: Install smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Proves the built artifact is usable, not just the working tree.
      - run: pip install .
      - run: hearth --version
