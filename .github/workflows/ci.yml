name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: mypy
      - name: Validate desktop entries and metadata
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils appstream shellcheck
          find . -name '*.desktop' -not -path './.git/*' -print0 | xargs -0 -r -n1 desktop-file-validate
          find data -name '*.metainfo.xml' -print0 2>/dev/null | xargs -0 -r -n1 appstreamcli validate --pedantic
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -r -n1 shellcheck

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e '.[dev]'
      # GTK is distro-provided. The GTK-specific smoke test runs in the
      # gui-smoke job with the matching system Python and Gtk 4 introspection.
      - run: pytest -m "not gui"

  gui-smoke:
    name: GTK4 GUI import smoke
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4 introspection and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi python3-gi-cairo gir1.2-gtk-4.0 xvfb
      - name: Create a test environment that can see distro PyGObject
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv-gui
          .venv-gui/bin/python -m pip install 'pytest>=8.0'
      - name: Import the actual GTK4 application module under Xvfb
        run: |
          cd "$(mktemp -d)"
          PYTHONPATH="${GITHUB_WORKSPACE}/src" xvfb-run -a "${GITHUB_WORKSPACE}/.venv-gui/bin/python" -m pytest -q --rootdir "${GITHUB_WORKSPACE}" -c "${GITHUB_WORKSPACE}/pyproject.toml" "${GITHUB_WORKSPACE}/tests" -m gui

  package:
    name: Install smoke test
    runs-on: ubuntu-latest
    needs: [test, gui-smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Proves the built artifact is usable, not just the working tree.
      - run: pip install .
      - run: hearth --version
